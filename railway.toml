# Railway config at repo root — forces Dockerfile build (not Railpack)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
# Leave empty in Railway UI if set — Dockerfile CMD runs start.sh
# If you must set a start command in UI, use:
# /app/start.sh
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
